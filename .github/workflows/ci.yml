name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/ecommerce_test?replicaSet=rs0
      MONGO_URI: mongodb://127.0.0.1:27017/ecommerce_test?replicaSet=rs0
      ACCESS_TOKEN_USER: ci-user-access-key-only-not-a-real-secret
      ACCESS_TOKEN_ADMIN: ci-admin-access-key-only-not-a-real-secret
      REFRESH_TOKEN_USER: ci-user-refresh-key-only-not-a-real-secret
      REFRESH_TOKEN_ADMIN: ci-admin-refresh-key-only-not-a-real-secret
      BEARER_USER: Bearer
      BEARER_ADMIN: Admin
      SALT_ROUND: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run build
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
      - run: npm run test:ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
